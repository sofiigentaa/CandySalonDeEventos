# Render Blueprint: servicio web + PostgreSQL de Render.
# Login propio: email + contraseña + app autenticadora (2FA). Sin Supabase.
# Las tablas se crean solas al arrancar el servidor (ensureTablesExist).
databases:
  - name: candy-salon-db
    plan: free
    region: oregon
    databaseName: candy_salon_eventos
    user: candy_app
    postgresMajorVersion: "16"

services:
  - type: web
    name: candy-salon-eventos
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # URL interna de la base de Render (misma región, sin SSL necesario).
      - key: DATABASE_URL
        fromDatabase:
          name: candy-salon-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOW_DEMO_RESET
        value: "false"
